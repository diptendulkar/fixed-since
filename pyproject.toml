[project]
name = "fixed-since"
version = "0.3.0"
description = "Find open GitHub issues that a later merged PR already fixed, and draft a cited reply for a maintainer to review."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Diptendu Das", email = "diptendu.tu@gmail.com" }]
keywords = ["github", "issues", "triage", "maintainers", "agents"]
dependencies = ["httpx>=0.27", "truststore>=0.10"]

[project.scripts]
fixed-since = "fixed_since.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
